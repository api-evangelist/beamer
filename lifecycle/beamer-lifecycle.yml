description: >-
  Versioning, deprecation and operational-commitment posture for the Beamer API and platform.
versioning:
  style: uri-path
  current_version: v0
  spec_version: 0.1.0
  base_url: https://api.getbeamer.com/v0
  policy_published: false
  note: >-
    Beamer's own developer documentation still describes the API as a beta ("We just launched a beta
    version of our API and Zapier integration"), and the reference reports version 0.1.0 while serving
    49 operations in production. No version-support or upgrade policy is published, and no second
    version has appeared, so there is no evidence of how a v1 would be introduced.
deprecation:
  policy_published: false
  sunset_header: not documented
  deprecation_header: not documented
  rfc8594: false
  deprecated_elements:
    - element: autoOpen
      kind: field
      schemas: [Post, PostCreation]
      marker: '[Deprecated]'
      replacement: not stated
      sunset_date: not stated
      source: https://getbeamer-api.pages.dev/
  note: >-
    The only deprecation signal anywhere in the surface is a "[Deprecated]" tag on the autoOpen field
    (and its matching POST /posts parameter). No removal date, no replacement, no Deprecation/Sunset
    response headers, and no deprecation policy page. No Deprecation pointer is emitted.
status_page:
