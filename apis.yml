aid: beamer
name: Beamer
description: >-
  Beamer is a changelog and notification center tool for announcing product updates,
  new features, and API changes to end users. It provides an embeddable feed widget,
  push notifications, email digests, and a public changelog page. The Beamer REST API
  enables programmatic management of posts, users, segments, and notification delivery.
  Beamer and Userflow now operate as one company, and Beamer's knowledge base has moved to
  help.userflow.com/beamer. The REST API is versioned at https://api.getbeamer.com/v0, documents 49
  operations across posts, comments, reactions, feature requests, users, NPS, team and GDPR erasure,
  and authenticates with a single account-scoped API key sent in the Beamer-Api-Key header. Four
  webhook event types are published. No OpenAPI document, Postman collection or MCP server is served
  on any Beamer host.
