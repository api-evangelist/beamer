specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Beamer
providerId: beamer
generated: '2026-09-14'
method: searched
source: https://www.getbeamer.com/pricing
docs: https://www.getbeamer.com/pricing
api_quota_source: https://getbeamer-api.pages.dev/
created: '2026-05-04'
modified: '2026-09-14'
tags:
  - Changelog
  - Notifications
  - Product Updates
  - User Engagement
description: >-
  Beamer's published plans, read from the pricing page on 2026-09-14, with the per-plan API request
  quota read from the Rate Limit section of Beamer's own API reference. This file replaces a
  2026-05-04 scaffold whose prices and quotas were invented defaults. Billing is metered on Monthly
  Active Users (unique users who load a page carrying the Beamer script); the API quota rides along
  with the plan and is not sold separately. Prices shown are USD per month, monthly billing first and
  annual-billing rate second. Feedback and NPS are paid add-ons on every tier.
plan_count: 5
currency: USD
billing_metric: Monthly Active Users (MAU)
free_trial: 14 days, no credit card required
plans:
  - id: beamer-free
    name: Free
    type: freemium
    price_monthly: '0.00'
    price_annual: '0.00'
    included_mau: 1000
    teammates: 1
    support: Basic
    entries:
      - label: API Requests
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
      - label: Included MAUs
        name: mau
        type: quota
        metric: monthly_active_users
        limit: 1000
        timeFrame: month
    note: >-
      Offered to accounts under 1,000 MAU ("Fewer than 1,000 Monthly Active Users? Try our Free plan").
      Some post categories are documented as unavailable on the Free plan.
  - id: beamer-starter
    name: Starter
    type: paid
    price_monthly: '59.00'
    price_annual: '49.00'
    included_mau: 5000
    teammates: unlimited
    support: Standard
    entries:
      - label: API Requests
        name: api_requests
        type: quota
        metric: requests
        limit: 2000
        timeFrame: month
      - label: Included MAUs
        name: mau
        type: quota
        metric: monthly_active_users
        limit: 5000
        timeFrame: month
    features:
      - In-app and standalone changelog
      - Boosted announcements
      - Appearance customization
      - Analytics
      - Additional MAUs can be added
    api_gates:
      - 'GET /posts: expired filter'
      - 'GET /url: language parameter'
  - id: beamer-pro
    name: Pro
    type: paid
    price_monthly: '119.00'
    price_annual: '99.00'
    included_mau: 10000
    teammates: unlimited
    support: Advanced
    entries:
      - label: API Requests
        name: api_requests
        type: quota
        metric: requests
        limit: 20000
        timeFrame: month
      - label: Included MAUs
        name: mau
        type: quota
        metric: monthly_active_users
        limit: 10000
        timeFrame: month
    features:
      - Everything in Starter
      - Dedicated Inbox
      - Comments and reactions
      - Basic segmentation
      - Custom CSS
    api_gates:
      - 'Segmentation parameters: filter, forceFilter, filterUrl, filterByUrl'
      - 'GET /url: theme parameter'
  - id: beamer-scale
    name: Scale
    type: paid
    price_monthly: '299.00'
    price_annual: '249.00'
    included_mau: 50000
    teammates: unlimited
    support: Priority
    entries:
      - label: API Requests
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
      - label: Included MAUs
        name: mau
        type: quota
        metric: monthly_active_users
        limit: 50000
        timeFrame: month
    features:
      - Everything in Pro
      - Advanced segmentation
      - User activities
      - Staging account
    api_gates:
      - 'GET /posts: filterByUserId (single-user posts)'
  - id: beamer-custom
    name: Custom
    type: enterprise
    price_monthly: null
    price_annual: null
    included_mau: custom
    teammates: unlimited
    support: Enterprise
    contact: https://www.getbeamer.com/contact
    entries: []
    note: >-
      "Get in touch" tier for accounts above 50,000 MAU; price and API quota are negotiated and not
      published. Onboarding and assisted installation are listed as Custom-only.
add_ons:
  - name: Feedback
    availability: add-on on Starter, Pro and Scale
    price: not published
  - name: NPS
    availability: add-on on Starter, Pro and Scale
    price: not published
  - name: Additional MAUs
    availability: Starter, Pro and Scale
    price: not published
  - name: API request overage
    price: $49 per first additional 100,000 requests, then $19 per 100,000
    source: https://getbeamer-api.pages.dev/
  - name: User Onboarding (by Userflow)
    availability: separate product, sold from userflow.com
    price: not published
