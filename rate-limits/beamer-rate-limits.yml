specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Beamer
providerId: beamer
generated: '2026-09-14'
method: searched
source: https://getbeamer-api.pages.dev/
docs: https://getbeamer-api.pages.dev/
created: '2026-05-04'
modified: '2026-09-14'
tags:
  - Changelog
  - Notifications
  - Product Updates
  - Rate Limiting
  - Quotas
  - Throttling
description: >-
  Published rate limits for the Beamer REST API, read verbatim from the "Rate Limit" section of
  Beamer's own API reference on 2026-09-14. This file replaces a 2026-05-04 scaffold whose header and
  quota values were invented defaults. Beamer enforces two ceilings — a per-second throughput limit and
  a monthly request quota tied to the billing plan — and signals neither in response headers.
limit_count: 6
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
headers_note: >-
  No rate-limit headers are documented, and none were returned on a live unauthenticated probe of
  GET https://api.getbeamer.com/v0/url (2026-09-14). A client cannot observe its remaining quota; it
  learns it is over the line only from a 429.
responseCodes:
  throttled: 429
  quotaExceeded: 429
limits:
  - name: Burst / throughput ceiling
    scope: account
    metric: requests_per_second
    limit: 30
    timeFrame: second
    applies_to: paid accounts
    note: >-
      "Our API currently enforces a rate limit of 30 requests per second for paid accounts." No
      per-second figure is published for the Free plan.
  - tier: free
    name: Free monthly quota
    scope: account
    metric: requests_per_month
    limit: 1000
    timeFrame: month
  - tier: starter
    name: Starter monthly quota
    scope: account
    metric: requests_per_month
    limit: 2000
    timeFrame: month
  - tier: pro
    name: Pro monthly quota
    scope: account
    metric: requests_per_month
    limit: 20000
    timeFrame: month
  - tier: scale
    name: Scale monthly quota
    scope: account
    metric: requests_per_month
    limit: 100000
    timeFrame: month
  - tier: overage
    name: Monthly quota overage
    scope: account
    metric: requests_per_month
    limit: null
    timeFrame: month
    overage:
      - block: first 100,000 additional requests
        price: '49.00'
        currency: USD
      - block: each subsequent 100,000 requests
        price: '19.00'
        currency: USD
    note: >-
      Overage is billed, not blocked — exceeding the plan quota costs $49 for the first extra 100k
      requests and $19 per 100k after that. Extensions are handled through the support chat.
exhaustion_behavior:
  status: 429
  body: >-
    "You have reached your account's monthly requests limit. If you think this is wrong, please reach
    out on our Support chat."
  retry_after_header: false
agent_note: >-
  A 10-item page-size cap (see conventions/beamer-conventions.yml) against a 1,000-2,000 request
  monthly quota is the binding constraint for any agent walking the posts, comments or users
  collections on the Free or Starter plan.
